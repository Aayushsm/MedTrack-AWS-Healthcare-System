{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="card-title mb-3 fw-bold">Schedule an Appointment</h4>
                <form action="{{ url_for('book_appointment') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Select Doctor</label>
                        <select name="doctor_id" class="form-select" required>
                            {% for doc in doctors %}
                                <option value="{{ doc.UserID }}">{{ doc.Name }} ({{ doc.UserID }})</option>
                            {% else %}
                                <option disabled selected>No doctors available yet</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Time Slot</label>
                        <input type="time" name="time" class="form-control" required>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('patient_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Confirm & Notify</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
